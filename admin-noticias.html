<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administração de Notícias | CSK Advogados</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #172033;
    }

    header {
      background: #101827;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      font-size: 22px;
    }

    header span {
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 1400px;
      margin: 30px auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      border: 1px solid #e5e7eb;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
      margin-top: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #334155;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    #conteudo {
      min-height: 260px;
    }

    .preview {
      margin-top: 15px;
      display: none;
    }

    .preview img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .option {
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      padding: 12px;
      background: #f8fafc;
    }

    .option label {
      margin: 0;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .option input {
      width: auto;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-primary {
      background: #172033;
      color: white;
    }

    .btn-primary:hover {
      background: #263449;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-success {
      background: #15803d;
      color: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      background: #fff;
    }

    .news-item-content {
      display: flex;
      gap: 15px;
    }

    .news-image {
      width: 120px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .news-info {
      flex: 1;
    }

    .news-info h3 {
      font-size: 17px;
      margin-bottom: 6px;
    }

    .category {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .badges {
      margin-top: 8px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 11px;
      background: #e5e7eb;
    }

    .badge.published {
      background: #dcfce7;
      color: #166534;
    }

    .badge.featured {
      background: #fef3c7;
      color: #92400e;
    }

    .item-actions {
      display: flex;
      gap: 7px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .item-actions button {
      padding: 8px 11px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      .container {
        width: 94%;
      }

      .card {
        padding: 18px;
      }

      .news-item-content {
        flex-direction: column;
      }

      .news-image {
        width: 100%;
        height: 160px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Administração de Notícias</h1>
    <span>CSK Advogados</span>
  </div>

  <button class="btn-secondary" onclick="novaNoticia()">
    + Nova notícia
  </button>
</header>

<div class="container">

  <div id="status" class="status"></div>

  <div class="grid">

    <!-- FORMULÁRIO -->
    <section class="card">

      <h2 id="formTitulo">Criar notícia</h2>

      <form id="newsForm">

        <input type="hidden" id="newsId">

        <label for="titulo">Título *</label>
        <input
          type="text"
          id="titulo"
          placeholder="Digite o título da notícia"
          required
        >

        <label for="categoria">Categoria *</label>

        <select id="categoria" required>
          <option value="">Selecione uma categoria</option>
          <option value="Cível">Cível</option>
          <option value="Societário">Societário</option>
          <option value="Digital & Inovação">Digital & Inovação</option>
          <option value="Trabalhista">Trabalhista</option>
          <option value="Institucional">Institucional</option>
          <option value="Tributário">Tributário</option>
          <option value="Empresarial">Empresarial</option>
          <option value="Outros">Outros</option>
        </select>

        <label for="resumo">Resumo</label>

        <textarea
          id="resumo"
          placeholder="Digite um resumo curto da notícia"
        ></textarea>

        <label for="imagem_url">URL da imagem</label>

        <input
          type="url"
          id="imagem_url"
          placeholder="https://exemplo.com/imagem.jpg"
          oninput="mostrarPreview()"
        >

        <div id="preview" class="preview">
          <img id="previewImg" src="" alt="Pré-visualização">
        </div>

        <label for="conteudo">Conteúdo da notícia *</label>

        <textarea
          id="conteudo"
          placeholder="Digite o conteúdo completo da notícia..."
          required
        ></textarea>

        <div class="options">

          <div class="option">
            <label>
              <input type="checkbox" id="publicada">
              Publicada
            </label>
          </div>

          <div class="option">
            <label>
              <input type="checkbox" id="destaque">
              Destaque
            </label>
          </div>

          <div class="option">
            <label>
              <input type="checkbox" id="exibir_inicio">
              Página inicial
            </label>
          </div>

        </div>

        <div class="actions">

          <button
            type="submit"
            class="btn-primary"
            id="saveButton"
          >
            Salvar notícia
          </button>

          <button
            type="button"
            class="btn-secondary"
            onclick="novaNoticia()"
          >
            Limpar
          </button>

        </div>

      </form>

    </section>


    <!-- LISTA DE NOTÍCIAS -->
    <section class="card">

      <h2>Notícias cadastradas</h2>

      <div id="newsList" class="news-list">

        <div class="loading">
          Carregando notícias...
        </div>

      </div>

    </section>

  </div>

</div>


<script>

  /*
  ============================================================
  CONFIGURAÇÃO DO SUPABASE
  ============================================================

  COLOQUE AQUI:
  1. URL do seu projeto Supabase
  2. sua chave pública (anon/publishable key)

  NÃO coloque a Service Role Key neste arquivo.
  ============================================================
  */

  const SUPABASE_URL = "COLOQUE_AQUI_A_URL_DO_SEU_SUPABASE";

  const SUPABASE_ANON_KEY = "COLOQUE_AQUI_A_SUA_CHAVE_PUBLICA";


  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ============================================================
  // ELEMENTOS
  // ============================================================

  const form = document.getElementById("newsForm");
  const newsList = document.getElementById("newsList");
  const statusBox = document.getElementById("status");


  // ============================================================
  // MENSAGENS
  // ============================================================

  function mostrarMensagem(texto, tipo = "success") {

    statusBox.textContent = texto;

    statusBox.className = "status " + tipo;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    setTimeout(() => {
      statusBox.className = "status";
    }, 5000);
  }


  // ============================================================
  // NOVA NOTÍCIA
  // ============================================================

  function novaNoticia() {

    form.reset();

    document.getElementById("newsId").value = "";

    document.getElementById("formTitulo").textContent =
      "Criar notícia";

    document.getElementById("saveButton").textContent =
      "Salvar notícia";

    document.getElementById("preview").style.display = "none";
  }


  // ============================================================
  // PREVIEW DA IMAGEM
  // ============================================================

  function mostrarPreview() {

    const url =
      document.getElementById("imagem_url").value.trim();

    const preview =
      document.getElementById("preview");

    const img =
      document.getElementById("previewImg");


    if (!url) {

      preview.style.display = "none";

      return;
    }


    img.src = url;

    preview.style.display = "block";


    img.onerror = function() {

      preview.style.display = "none";

    };

  }


  // ============================================================
  // CARREGAR NOTÍCIAS
  // ============================================================

  async function carregarNoticias() {

    newsList.innerHTML = `
      <div class="loading">
        Carregando notícias...
      </div>
    `;


    const { data, error } = await db
      .from("noticias")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      newsList.innerHTML = `
        <div class="empty">
          Não foi possível carregar as notícias.
          <br><br>
          <small>${escapeHtml(error.message)}</small>
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      newsList.innerHTML = `
        <div class="empty">
          Nenhuma notícia cadastrada.
        </div>
      `;

      return;
    }


    newsList.innerHTML = data
      .map(noticia => criarCardNoticia(noticia))
      .join("");

  }


  // ============================================================
  // CARD DA NOTÍCIA
  // ============================================================

  function criarCardNoticia(noticia) {

    const imagem =
      noticia.imagem_url ||
      "https://placehold.co/600x400?text=Sem+imagem";


    const publicada =
      noticia.publicada === true;


    const destaque =
      noticia.destaque === true;


    const inicio =
      noticia.exibir_inicio === true;


    return `

      <article class="news-item">

        <div class="news-item-content">

          <img
            class="news-image"
            src="${escapeAttribute(imagem)}"
            alt=""
            onerror="this.src='https://placehold.co/600x400?text=Sem+imagem'"
          >

          <div class="news-info">

            <span class="category">
              ${escapeHtml(noticia.categoria || "Sem categoria")}
            </span>

            <h3>
              ${escapeHtml(noticia.titulo || "")}
            </h3>

            <p>
              ${escapeHtml(
                noticia.resumo || ""
              )}
            </p>

            <div class="badges">

              <span class="badge ${publicada ? "published" : ""}">
                ${publicada ? "✓ Publicada" : "Rascunho"}
              </span>

              ${
                destaque
                ? `<span class="badge featured">⭐ Destaque</span>`
                : ""
              }

              ${
                inicio
                ? `<span class="badge">🏠 Página inicial</span>`
                : ""
              }

            </div>

          </div>

        </div>


        <div class="item-actions">

          <button
            class="btn-primary"
            onclick="editarNoticia('${noticia.id}')"
          >
            ✏️ Editar
          </button>


          <button
            class="${publicada ? "btn-secondary" : "btn-success"}"
            onclick="alternarPublicacao('${noticia.id}', ${publicada})"
          >
            ${publicada ? "Despublicar" : "Publicar"}
          </button>


          <button
            class="btn-danger"
            onclick="excluirNoticia('${noticia.id}')"
          >
            🗑️ Excluir
          </button>

        </div>

      </article>

    `;

  }


  // ============================================================
  // SALVAR
  // ============================================================

  form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const id =
      document.getElementById("newsId").value.trim();


    const titulo =
      document.getElementById("titulo").value.trim();


    const categoria =
      document.getElementById("categoria").value;


    const resumo =
      document.getElementById("resumo").value.trim();


    const conteudo =
      document.getElementById("conteudo").value.trim();


    const imagem_url =
      document.getElementById("imagem_url").value.trim();


    const publicada =
      document.getElementById("publicada").checked;


    const destaque =
      document.getElementById("destaque").checked;


    const exibir_inicio =
      document.getElementById("exibir_inicio").checked;


    if (!titulo || !categoria || !conteudo) {

      mostrarMensagem(
        "Preencha os campos obrigatórios.",
        "error"
      );

      return;
    }


    const saveButton =
      document.getElementById("saveButton");


    saveButton.disabled = true;

    saveButton.textContent = "Salvando...";


    try {

      const dados = {

        titulo: titulo,

        categoria: categoria,

        resumo: resumo || null,

        conteudo: conteudo,

        imagem_url: imagem_url || null,

        publicada: publicada,

        destaque: destaque,

        exibir_inicio: exibir_inicio

      };


      let resultado;


      // EDITAR
      if (id) {

        resultado = await db
          .from("noticias")
          .update(dados)
          .eq("id", id);

      }

      // CRIAR
      else {

        resultado = await db
          .from("noticias")
          .insert([dados]);

      }


      if (resultado.error) {

        throw resultado.error;

      }


      mostrarMensagem(
        id
        ? "Notícia atualizada com sucesso!"
        : "Notícia criada com sucesso!"
      );


      novaNoticia();

      await carregarNoticias();


    } catch (error) {

      console.error(error);

      mostrarMensagem(
        "Erro ao salvar notícia: " +
        error.message,
        "error"
      );

    } finally {

      saveButton.disabled = false;

      saveButton.textContent =
        id
        ? "Salvar alterações"
        : "Salvar notícia";

    }

  });


  // ============================================================
  // EDITAR NOTÍCIA
  // ============================================================

  async function editarNoticia(id) {

    const { data, error } = await db
      .from("noticias")
      .select("*")
      .eq("id", id)
      .single();


    if (error) {

      mostrarMensagem(
        "Erro ao carregar notícia: " +
        error.message,
        "error"
      );

      return;
    }


    document.getElementById("newsId").value =
      data.id || "";


    document.getElementById("titulo").value =
      data.titulo || "";


    document.getElementById("categoria").value =
      data.categoria || "";


    document.getElementById("resumo").value =
      data.resumo || "";


    document.getElementById("conteudo").value =
      data.conteudo || "";


    document.getElementById("imagem_url").value =
      data.imagem_url || "";


    document.getElementById("publicada").checked =
      data.publicada === true;


    document.getElementById("destaque").checked =
      data.destaque === true;


    document.getElementById("exibir_inicio").checked =
      data.exibir_inicio === true;


    document.getElementById("formTitulo").textContent =
      "Editar notícia";


    document.getElementById("saveButton").textContent =
      "Salvar alterações";


    mostrarPreview();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // ============================================================
  // PUBLICAR / DESPUBLICAR
  // ============================================================

  async function alternarPublicacao(id, estadoAtual) {

    const novoEstado = !estadoAtual;


    const { error } = await db
      .from("noticias")
      .update({
        publicada: novoEstado
      })
      .eq("id", id);


    if (error) {

      mostrarMensagem(
        "Erro ao alterar publicação: " +
        error.message,
        "error"
      );

      return;
    }


    mostrarMensagem(
      novoEstado
      ? "Notícia publicada!"
      : "Notícia despublicada!"
    );


    await carregarNoticias();

  }


  // ============================================================
  // EXCLUIR
  // ============================================================

  async function excluirNoticia(id) {

    const confirmar =
      confirm(
        "Tem certeza que deseja excluir esta notícia?"
      );


    if (!confirmar) return;


    const { error } = await db
      .from("noticias")
      .delete()
      .eq("id", id);


    if (error) {

      mostrarMensagem(
        "Erro ao excluir notícia: " +
        error.message,
        "error"
      );

      return;
    }


    mostrarMensagem(
      "Notícia excluída com sucesso!"
    );


    await carregarNoticias();

  }


  // ============================================================
  // SEGURANÇA PARA TEXTO HTML
  // ============================================================

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(text) {

    return escapeHtml(text);

  }


  // ============================================================
  // INICIAR
  // ============================================================

  carregarNoticias();

</script>

</body>
</html>
