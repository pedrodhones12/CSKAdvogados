<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração de Notícias | CSK Advogados</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",Arial,Helvetica,sans-serif;background:#eeece8;color:#17243a}.container{width:94%;max-width:1400px;margin:30px auto}.header{background:#101a2b;color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.header h1{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:500}.header span{color:#cbd5e1;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:25px}.card{background:#fff;border-radius:4px;padding:28px;box-shadow:0 8px 28px rgba(16,26,43,.07);border:1px solid rgba(23,36,58,.12)}.card h2{margin-bottom:20px;font-family:Georgia,"Times New Roman",serif;font-weight:500;color:#17243a}label{display:block;font-weight:700;font-size:13px;margin:15px 0 7px;color:#17243a}input,textarea,select{width:100%;border:1px solid #cfd4dc;border-radius:3px;padding:12px;font-size:15px;outline:none;background:#fff;color:#17243a}input:focus,textarea:focus,select:focus{border-color:#17243a}textarea{min-height:130px;resize:vertical}#conteudo{min-height:260px}button{border:0;border-radius:3px;padding:12px 18px;cursor:pointer;font-weight:700}.primary{background:#17243a;color:#fff}.secondary{background:#e6e4df;color:#17243a}.danger{background:#b42318;color:#fff}.success{background:#176b3a;color:#fff}.actions,.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.status{display:none;padding:12px;border-radius:3px;margin-bottom:15px}.status.ok{display:block;background:#e2f3e8;color:#176b3a}.status.error{display:block;background:#fbe5e3;color:#9b2117}.news-list{display:flex;flex-direction:column;gap:15px}.news-item{border:1px solid #e2e1de;border-radius:4px;padding:15px}.news-item-content{display:flex;gap:15px}.news-image{width:120px;height:80px;border-radius:3px;object-fit:cover;background:#e5e3df}.news-info{flex:1}.category{display:inline-block;background:#eef0f4;color:#17243a;padding:4px 8px;border-radius:2px;font-size:11px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{padding:4px 7px;border-radius:2px;font-size:11px;background:#e5e3df}.published{background:#e2f3e8;color:#176b3a}.featured{background:#f8edd0;color:#8a6411}.empty,.loading{text-align:center;padding:30px;color:#687386}.login{max-width:460px;margin:80px auto}.hidden{display:none!important}.userbar{display:flex;align-items:center;gap:10px;font-size:13px}.upload-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.file-box{border:1px dashed #aeb5c0;border-radius:3px;padding:14px;background:#f8f7f4}.file-box input[type=file]{border:0;padding:4px 0;background:transparent}.help{font-size:12px;color:#687386;margin-top:7px;line-height:1.5}.preview-wrap{display:none;margin-top:12px;border:1px solid #ddd9d1;padding:8px}.preview-wrap img{width:100%;max-height:250px;object-fit:cover;border-radius:2px}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.news-item-content{flex-direction:column}.news-image{width:100%;height:160px}.header{padding:15px}.userbar span{display:none}.upload-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><div><h1>Administração de Notícias</h1><span>CSK | Cardoso Sena Kruschewsky Advogados</span></div><div class="userbar"><span id="userEmail"></span><button id="logoutBtn" class="secondary hidden">Sair</button></div></header>
<div id="loginView" class="container"><section class="card login"><h2>Acesso administrativo</h2><p style="color:#687386;margin-bottom:15px">Entre com a conta autorizada para administrar as notícias.</p><div id="loginStatus" class="status"></div><form id="loginForm"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required><div class="actions"><button class="primary" id="loginButton">Entrar</button></div></form></section></div>
<div id="adminView" class="container hidden"><div id="status" class="status"></div><div class="grid"><section class="card"><h2 id="formTitulo">Criar notícia</h2><form id="newsForm"><input type="hidden" id="newsId"><label>Título *</label><input id="titulo" required><label>Categoria *</label><select id="categoria" required><option value="">Selecione</option><option>Cível</option><option>Societário</option><option>Digital & Inovação</option><option>Trabalhista</option><option>Institucional</option><option>Tributário</option><option>Empresarial</option><option>Outros</option></select><label>Resumo</label><textarea id="resumo"></textarea><label>Imagem da notícia</label><div class="upload-row"><div class="file-box"><input id="imagem_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="help">Escolha uma imagem do celular ou computador. JPG, PNG, WEBP ou GIF.</div></div><button type="button" class="secondary" id="uploadButton">📷 Adicionar imagem</button></div><div class="help">Ou use uma URL:</div><input id="imagem_url" type="url" placeholder="https://..." oninput="previewImage()"><div id="preview" class="preview-wrap"><img id="previewImg" alt="Pré-visualização da imagem"></div><label>Conteúdo *</label><textarea id="conteudo" required></textarea><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px"><label style="font-weight:normal;margin:0"><input type="checkbox" id="publicada" style="width:auto"> Publicada</label><label style="font-weight:normal;margin:0"><input type="checkbox" id="destaque" style="width:auto"> Destaque</label><label style="font-weight:normal;margin:0"><input type="checkbox" id="exibir_inicio" style="width:auto"> Página inicial</label></div><div class="actions"><button class="primary" id="saveButton">Salvar notícia</button><button type="button" class="secondary" onclick="novaNoticia()">Limpar</button></div></form></section><section class="card"><h2>Notícias cadastradas</h2><div id="newsList" class="news-list"><div class="loading">Carregando...</div></div></section></div></div>
<script>
const SUPABASE_URL="https://elrldxaapgfbygurzdzb.supabase.co";
const SUPABASE_KEY="sb_publishable_cLOSGNA_YltxIaezf9JokA_FYcIttmn";
const {createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);
function msg(text,type='ok',login=false){const el=$(login?'loginStatus':'status');el.textContent=text;el.className='status '+(type==='ok'?'ok':'error')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function checkAuth(){const {data:{session}}=await db.auth.getSession();setAuth(session);if(session)loadNews()}
function setAuth(session){$('loginView').classList.toggle('hidden',!!session);$('adminView').classList.toggle('hidden',!session);$('logoutBtn').classList.toggle('hidden',!session);$('userEmail').textContent=session?.user?.email||''}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});$('loginButton').disabled=false;if(error){msg('Não foi possível entrar: '+error.message,'error',true);return}$('loginPassword').value='';setAuth((await db.auth.getSession()).data.session);loadNews()});
$('logoutBtn').onclick=async()=>{await db.auth.signOut()};db.auth.onAuthStateChange((_event,session)=>setAuth(session));
function novaNoticia(){ $('newsForm').reset();$('newsId').value='';$('formTitulo').textContent='Criar notícia';$('saveButton').textContent='Salvar notícia';$('preview').style.display='none';$('previewImg').src='';$('imagem_file').value=''}
function previewImage(){const u=$('imagem_url').value.trim();if(!u){if(!$('imagem_file').files.length)$('preview').style.display='none';return}$('previewImg').src=u;$('preview').style.display='block'}
$('imagem_file').addEventListener('change',()=>{const f=$('imagem_file').files[0];if(!f)return;if(f.size>5*1024*1024){msg('A imagem deve ter no máximo 5 MB.','error');$('imagem_file').value='';return}const reader=new FileReader();reader.onload=()=>{$('previewImg').src=reader.result;$('preview').style.display='block'};reader.readAsDataURL(f)});
$('uploadButton').addEventListener('click',async()=>{const file=$('imagem_file').files[0];if(!file){msg('Escolha uma imagem primeiro.','error');return}const {data:{session}}=await db.auth.getSession();if(!session){msg('Sua sessão expirou. Faça login novamente.','error');return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${session.user.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;$('uploadButton').disabled=true;$('uploadButton').textContent='Enviando...';const {error}=await db.storage.from('noticias').upload(path,file,{contentType:file.type,upsert:false});if(error){msg('Não foi possível enviar a imagem: '+error.message,'error');$('uploadButton').disabled=false;$('uploadButton').textContent='📷 Adicionar imagem';return}const {data}=db.storage.from('noticias').getPublicUrl(path);$('imagem_url').value=data.publicUrl;previewImage();$('uploadButton').disabled=false;$('uploadButton').textContent='✓ Imagem adicionada';msg('Imagem enviada com sucesso!');});
async function loadNews(){const {data,error}=await db.from('noticias').select('*').order('created_at',{ascending:false});if(error){$('newsList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}if(!data?.length){$('newsList').innerHTML='<div class="empty">Nenhuma notícia cadastrada.</div>';return}$('newsList').innerHTML=data.map(card).join('')}
function card(n){const img=esc(n.imagem_url||'https://placehold.co/600x400?text=CSK');return `<article class="news-item"><div class="news-item-content"><img class="news-image" src="${img}" onerror="this.src='https://placehold.co/600x400?text=CSK'" alt=""><div class="news-info"><span class="category">${esc(n.categoria)}</span><h3 style="margin:7px 0">${esc(n.titulo)}</h3><p style="color:#687386">${esc(n.resumo||'')}</p><div class="badges"><span class="badge ${n.publicada?'published':''}">${n.publicada?'✓ Publicada':'Rascunho'}</span>${n.destaque?'<span class="badge featured">Destaque</span>':''}${n.exibir_inicio?'<span class="badge">Página inicial</span>':''}</div></div></div><div class="item-actions"><button class="primary" onclick="editNews('${n.id}')">Editar</button><button class="${n.publicada?'secondary':'success'}" onclick="togglePublished('${n.id}',${!!n.publicada})">${n.publicada?'Despublicar':'Publicar'}</button><button class="danger" onclick="deleteNews('${n.id}')">Excluir</button></div></article>`}
$('newsForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('newsId').value.trim();const dados={titulo:$('titulo').value.trim(),categoria:$('categoria').value,resumo:$('resumo').value.trim()||null,conteudo:$('conteudo').value.trim(),imagem_url:$('imagem_url').value.trim()||null,publicada:$('publicada').checked,destaque:$('destaque').checked,exibir_inicio:$('exibir_inicio').checked};if(!dados.titulo||!dados.categoria||!dados.conteudo){msg('Preencha os campos obrigatórios.','error');return}$('saveButton').disabled=true;const result=id?await db.from('noticias').update(dados).eq('id',id):await db.from('noticias').insert([dados]);$('saveButton').disabled=false;if(result.error){msg('Erro ao salvar: '+result.error.message,'error');return}msg(id?'Notícia atualizada!':'Notícia criada!');novaNoticia();loadNews()});
async function editNews(id){const {data,error}=await db.from('noticias').select('*').eq('id',id).single();if(error){msg(error.message,'error');return}$('newsId').value=data.id;$('titulo').value=data.titulo||'';$('categoria').value=data.categoria||'';$('resumo').value=data.resumo||'';$('conteudo').value=data.conteudo||'';$('imagem_url').value=data.imagem_url||'';$('publicada').checked=!!data.publicada;$('destaque').checked=!!data.destaque;$('exibir_inicio').checked=!!data.exibir_inicio;$('formTitulo').textContent='Editar notícia';$('saveButton').textContent='Salvar alterações';previewImage();scrollTo(0,0)}
async function togglePublished(id,current){const {error}=await db.from('noticias').update({publicada:!current}).eq('id',id);if(error){msg(error.message,'error');return}loadNews()}
async function deleteNews(id){if(!confirm('Tem certeza que deseja excluir esta notícia?'))return;const {error}=await db.from('noticias').delete().eq('id',id);if(error){msg(error.message,'error');return}loadNews()}
checkAuth();
</script></body></html>
