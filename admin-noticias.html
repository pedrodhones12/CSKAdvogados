<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração de Notícias | CSK Advogados</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#172033}.container{width:95%;max-width:1400px;margin:30px auto}.header{background:#101827;color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.header h1{font-size:22px}.header span{color:#cbd5e1;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:25px}.card{background:#fff;border-radius:14px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,.06);border:1px solid #e5e7eb}.card h2{margin-bottom:20px}label{display:block;font-weight:bold;font-size:14px;margin:15px 0 7px}input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:12px;font-size:15px;outline:none;background:#fff}textarea{min-height:130px;resize:vertical}#conteudo{min-height:260px}button{border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-weight:bold}.primary{background:#172033;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#dc2626;color:#fff}.success{background:#15803d;color:#fff}.actions,.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.status{display:none;padding:12px;border-radius:8px;margin-bottom:15px}.status.ok{display:block;background:#dcfce7;color:#166534}.status.error{display:block;background:#fee2e2;color:#991b1b}.news-list{display:flex;flex-direction:column;gap:15px}.news-item{border:1px solid #e5e7eb;border-radius:12px;padding:15px}.news-item-content{display:flex;gap:15px}.news-image{width:120px;height:80px;border-radius:8px;object-fit:cover;background:#e5e7eb}.news-info{flex:1}.category{display:inline-block;background:#eef2ff;color:#3730a3;padding:4px 8px;border-radius:20px;font-size:11px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{padding:4px 7px;border-radius:5px;font-size:11px;background:#e5e7eb}.published{background:#dcfce7;color:#166534}.featured{background:#fef3c7;color:#92400e}.empty,.loading{text-align:center;padding:30px;color:#64748b}.login{max-width:460px;margin:80px auto}.hidden{display:none!important}.userbar{display:flex;align-items:center;gap:10px;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.news-item-content{flex-direction:column}.news-image{width:100%;height:160px}.header{padding:15px}.userbar span{display:none}}
</style>
</head>
<body>
<header class="header"><div><h1>Administração de Notícias</h1><span>CSK Advogados</span></div><div class="userbar"><span id="userEmail"></span><button id="logoutBtn" class="secondary hidden">Sair</button></div></header>
<div id="loginView" class="container"><section class="card login"><h2>Acesso administrativo</h2><p style="color:#64748b;margin-bottom:15px">Entre com a conta autorizada para administrar as notícias.</p><div id="loginStatus" class="status"></div><form id="loginForm"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required><div class="actions"><button class="primary" id="loginButton">Entrar</button></div></form></section></div>
<div id="adminView" class="container hidden"><div id="status" class="status"></div><div class="grid"><section class="card"><h2 id="formTitulo">Criar notícia</h2><form id="newsForm"><input type="hidden" id="newsId"><label>Título *</label><input id="titulo" required><label>Categoria *</label><select id="categoria" required><option value="">Selecione</option><option>Cível</option><option>Societário</option><option>Digital & Inovação</option><option>Trabalhista</option><option>Institucional</option><option>Tributário</option><option>Empresarial</option><option>Outros</option></select><label>Resumo</label><textarea id="resumo"></textarea><label>URL da imagem</label><input id="imagem_url" type="url" placeholder="https://..." oninput="previewImage()"><div id="preview" style="display:none;margin-top:10px"><img id="previewImg" style="width:100%;max-height:250px;object-fit:cover;border-radius:10px"></div><label>Conteúdo *</label><textarea id="conteudo" required></textarea><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px"><label style="font-weight:normal;margin:0"><input type="checkbox" id="publicada" style="width:auto"> Publicada</label><label style="font-weight:normal;margin:0"><input type="checkbox" id="destaque" style="width:auto"> Destaque</label><label style="font-weight:normal;margin:0"><input type="checkbox" id="exibir_inicio" style="width:auto"> Página inicial</label></div><div class="actions"><button class="primary" id="saveButton">Salvar notícia</button><button type="button" class="secondary" onclick="novaNoticia()">Limpar</button></div></form></section><section class="card"><h2>Notícias cadastradas</h2><div id="newsList" class="news-list"><div class="loading">Carregando...</div></div></section></div></div>
<script>
const SUPABASE_URL="https://elrldxaapgfbygurzdzb.supabase.co";
const SUPABASE_KEY="sb_publishable_cLOSGNA_YltxIaezf9JokA_FYcIttmn";
const {createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function msg(text,type='ok'){const el=$(type==='login'?'loginStatus':'status');el.textContent=text;el.className='status '+(type==='ok'?'ok':'error')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function checkAuth(){const {data:{session}}=await db.auth.getSession();setAuth(session);if(session)loadNews()}
function setAuth(session){$('loginView').classList.toggle('hidden',!!session);$('adminView').classList.toggle('hidden',!session);$('logoutBtn').classList.toggle('hidden',!session);$('userEmail').textContent=session?.user?.email||''}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});$('loginButton').disabled=false;if(error){msg('Não foi possível entrar: '+error.message,'error');return} $('loginPassword').value='';msg('Login realizado.');loadNews()});
$('logoutBtn').onclick=async()=>{await db.auth.signOut()};db.auth.onAuthStateChange((_event,session)=>setAuth(session));
function novaNoticia(){ $('newsForm').reset();$('newsId').value='';$('formTitulo').textContent='Criar notícia';$('saveButton').textContent='Salvar notícia';$('preview').style.display='none'}
function previewImage(){const u=$('imagem_url').value.trim();if(!u){$('preview').style.display='none';return}$('previewImg').src=u;$('preview').style.display='block'}
async function loadNews(){const {data,error}=await db.from('noticias').select('*').order('created_at',{ascending:false});if(error){$('newsList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}if(!data?.length){$('newsList').innerHTML='<div class="empty">Nenhuma notícia cadastrada.</div>';return}$('newsList').innerHTML=data.map(card).join('')}
function card(n){const img=esc(n.imagem_url||'https://placehold.co/600x400?text=CSK');return `<article class="news-item"><div class="news-item-content"><img class="news-image" src="${img}" onerror="this.src='https://placehold.co/600x400?text=CSK'" alt=""><div class="news-info"><span class="category">${esc(n.categoria)}</span><h3 style="margin:7px 0">${esc(n.titulo)}</h3><p style="color:#64748b">${esc(n.resumo||'')}</p><div class="badges"><span class="badge ${n.publicada?'published':''}">${n.publicada?'✓ Publicada':'Rascunho'}</span>${n.destaque?'<span class="badge featured">⭐ Destaque</span>':''}${n.exibir_inicio?'<span class="badge">🏠 Página inicial</span>':''}</div></div></div><div class="item-actions"><button class="primary" onclick="editNews('${n.id}')">Editar</button><button class="${n.publicada?'secondary':'success'}" onclick="togglePublished('${n.id}',${!!n.publicada})">${n.publicada?'Despublicar':'Publicar'}</button><button class="danger" onclick="deleteNews('${n.id}')">Excluir</button></div></article>`}
$('newsForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('newsId').value.trim();const dados={titulo:$('titulo').value.trim(),categoria:$('categoria').value,resumo:$('resumo').value.trim()||null,conteudo:$('conteudo').value.trim(),imagem_url:$('imagem_url').value.trim()||null,publicada:$('publicada').checked,destaque:$('destaque').checked,exibir_inicio:$('exibir_inicio').checked};if(!dados.titulo||!dados.categoria||!dados.conteudo){msg('Preencha os campos obrigatórios.','error');return}$('saveButton').disabled=true;const result=id?await db.from('noticias').update(dados).eq('id',id):await db.from('noticias').insert([dados]);$('saveButton').disabled=false;if(result.error){msg('Erro ao salvar: '+result.error.message,'error');return}msg(id?'Notícia atualizada!':'Notícia criada!');novaNoticia();loadNews()});
async function editNews(id){const {data,error}=await db.from('noticias').select('*').eq('id',id).single();if(error){msg(error.message,'error');return}$('newsId').value=data.id;$('titulo').value=data.titulo||'';$('categoria').value=data.categoria||'';$('resumo').value=data.resumo||'';$('conteudo').value=data.conteudo||'';$('imagem_url').value=data.imagem_url||'';$('publicada').checked=!!data.publicada;$('destaque').checked=!!data.destaque;$('exibir_inicio').checked=!!data.exibir_inicio;$('formTitulo').textContent='Editar notícia';$('saveButton').textContent='Salvar alterações';previewImage();scrollTo(0,0)}
async function togglePublished(id,current){const {error}=await db.from('noticias').update({publicada:!current}).eq('id',id);if(error){msg(error.message,'error');return}loadNews()}
async function deleteNews(id){if(!confirm('Tem certeza que deseja excluir esta notícia?'))return;const {error}=await db.from('noticias').delete().eq('id',id);if(error){msg(error.message,'error');return}loadNews()}
checkAuth();
</script></body></html>
