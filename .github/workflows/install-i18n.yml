name: Install CSK multilingual selector
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add multilingual script to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['index.html','equipe.html','noticias.html','noticia.html','admin-noticias.html']
          changed=[]
          for name in files:
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              marker='<script src="i18n.js"></script>'
              if marker in text:
                  continue
              text=text.replace('</head>', '  '+marker+'\n</head>', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(name)
          if changed:
              print('Updated:', ', '.join(changed))
          else:
              print('All pages already contain i18n.js')
          PY
      - name: Commit multilingual integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html equipe.html noticias.html noticia.html admin-noticias.html
          git commit -m 'Add global multilingual language selector'
          git push